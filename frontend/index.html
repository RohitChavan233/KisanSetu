<!DOCTYPE html>
<html lang="mr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>KisanSetu · किसानसेतु</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css?v=4" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body class="is-login">
  <div id="login-screen" class="login-wrap">
    <section class="login-hero" aria-label="About KisanSetu">
      <div class="hero-inner">
        <p class="eyebrow" id="login-gov"></p>
        <div class="hero-brand">
          <span class="brand-mark light">KS</span>
          <div>
            <h1>किसानसेतु</h1>
            <p class="brand-en">KisanSetu</p>
          </div>
        </div>
        <p class="login-tag" id="login-tag"></p>
        <ul class="login-points">
          <li id="feat1"></li>
          <li id="feat2"></li>
          <li id="feat3"></li>
        </ul>
        <p class="hero-foot" id="login-problem"></p>
      </div>
    </section>
    <section class="login-pane">
      <form id="login-form" class="login-card" autocomplete="off">
        <div class="lang-switch" id="login-lang" role="group" aria-label="Language"></div>
        <h2 id="login-title"></h2>
        <p class="muted login-sub" id="login-sub"></p>
        <ol class="steps">
          <li id="step-phone" class="on"><span>1</span><em id="step1-lbl"></em></li>
          <li id="step-otp"><span>2</span><em id="step2-lbl"></em></li>
        </ol>
        <label for="phone" id="lbl-phone"></label>
        <input id="phone" inputmode="numeric" maxlength="10" placeholder="9876543210" autocomplete="tel" />
        <p class="hint" id="demo-hint"></p>
        <div class="demo-grid" id="demo-row"></div>
        <button type="button" class="btn primary big" id="btn-otp"></button>
        <div id="otp-block" class="otp-block" hidden>
          <label for="otp" id="lbl-otp"></label>
          <input id="otp" inputmode="numeric" maxlength="6" placeholder="123456" autocomplete="one-time-code" />
          <button type="submit" class="btn primary big" id="btn-verify"></button>
        </div>
        <p class="form-msg" id="login-msg" role="status"></p>
      </form>
    </section>
  </div>

  <div id="app" hidden>
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-mark">KS</span>
        <div>
          <strong>किसानसेतु</strong>
          <small>KisanSetu</small>
        </div>
      </div>
      <nav id="nav" aria-label="Main"></nav>
      <div class="side-foot">
        <p class="who-side"><span id="who-name-side"></span><small id="who-role-side"></small></p>
        <button class="btn ghost speak-all" id="btn-speak-page" type="button"></button>
      </div>
    </aside>
    <div class="main">
      <header class="topbar">
        <button class="menu-btn" id="menu-btn" type="button" aria-label="Menu">☰</button>
        <div class="page-head">
          <h1 id="page-title">Home</h1>
          <p id="page-sub" class="muted"></p>
        </div>
        <div class="top-actions">
          <label class="sr-only" for="lang-select" id="lbl-lang">Language</label>
          <select id="lang-select" aria-label="Language"></select>
          <div class="who">
            <span id="who-name"></span>
            <small id="who-role"></small>
          </div>
          <button class="btn" id="btn-logout" type="button">Sign out</button>
        </div>
      </header>
      <main id="view" class="view"></main>
    </div>
  </div>

  <div class="nav-scrim" id="nav-scrim" hidden></div>
  <div id="modal" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h3 id="modal-title"></h3>
      <p class="muted" id="modal-sub"></p>
      <label class="sr-only" for="modal-input" id="modal-lbl">Value</label>
      <input id="modal-input" />
      <div class="actions end">
        <button type="button" class="btn" id="modal-cancel"></button>
        <button type="button" class="btn primary" id="modal-ok"></button>
      </div>
    </div>
  </div>
  <div id="toast" hidden></div>
  <script src="js/i18n.js?v=4"></script>
  <script src="js/app.js?v=4"></script>
</body>
</html>
